[project]
name = "swarm"
version = "0.1.0"
description = "Swarm: Telegram crypto research agent (answers questions, does not post calls)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20",
    "ccxt>=4.4",
    "httpx>=0.27",
    "openai>=1.60",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
